# Release: build the four lamp binaries and attach them to the tag's release.
#
# Every target is the same recipe: the Synsema engine binary for that platform
# (the donor) + lamp.syn embedded, sealed with a sha256 — `synsema build` does the
# splice, so one Linux runner cross-builds all four. Assets follow what
# lamps.sh/install expects: lamp-<os>-<arch>[.exe] + .sha256.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SYNSEMA_RELEASE: https://github.com/kitecosmic/synsema/releases/latest/download

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: engine + donors (sha256-verified)
        run: |
          mkdir -p donors
          for a in synsema-linux-x86_64 synsema-macos-x86_64 synsema-macos-aarch64 synsema-windows-x86_64.exe; do
            curl -fsSL -o "donors/$a" "$SYNSEMA_RELEASE/$a"
            curl -fsSL -o "donors/$a.sha256" "$SYNSEMA_RELEASE/$a.sha256"
            # .sha256 formats vary across assets (uppercase, CRLF, with or without a
            # filename) — normalize to "hash  name" before checking.
            (cd donors && awk '{print $1}' "$a.sha256" | tr -d '\r' | tr 'A-F' 'a-f' | sed "s|\$|  $a|" | sha256sum -c -)
          done
          chmod +x donors/synsema-linux-x86_64

      - name: check + tests
        run: |
          donors/synsema-linux-x86_64 check lamp.syn
          donors/synsema-linux-x86_64 test core.syn
          donors/synsema-linux-x86_64 test lamp.syn

      - name: build the four binaries
        run: |
          mkdir -p dist
          donors/synsema-linux-x86_64 build lamp.syn -o dist/lamp-linux-x64
          donors/synsema-linux-x86_64 build lamp.syn -o dist/lamp-darwin-x64      --engine-binary donors/synsema-macos-x86_64
          donors/synsema-linux-x86_64 build lamp.syn -o dist/lamp-darwin-arm64    --engine-binary donors/synsema-macos-aarch64
          donors/synsema-linux-x86_64 build lamp.syn -o dist/lamp-windows-x64.exe --engine-binary donors/synsema-windows-x86_64.exe
          cd dist && for f in lamp-*; do sha256sum "$f" > "$f.sha256"; done && ls -la

      - name: smoke test the linux binary
        run: |
          chmod +x dist/lamp-linux-x64
          dist/lamp-linux-x64 version

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "$TAG" --notes "single-binary lamp CLI ($TAG)" --verify-tag || true
          gh release upload "$TAG" dist/* --clobber
